<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trend Bot">
  <title>Trend Bot</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <span class="mk"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12l4-4 3 2 6-7"/></svg></span>
        Trend Bot
      </div>
      <div class="fresh" id="fresh">
        <span class="stamp"><span class="dot"></span><span id="stamp">loading…</span></span>
        <button id="refresh" aria-label="Refresh">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13.5 8a5.5 5.5 0 11-1.6-3.9"/><path d="M13.5 2v3h-3"/></svg>
        </button>
      </div>
    </header>

    <nav class="seg" id="seg">
      <button data-view="combined" class="on">Combined</button>
      <button data-view="markets">Markets</button>
      <button data-view="crypto">Crypto</button>
    </nav>

    <main id="main"><div class="loading">Loading…</div></main>
  </div>

  <div class="sheet" id="sheet"><div class="panel" id="sheetPanel"></div></div>

  <script src="./app.js"></script>
</body>
</html>
